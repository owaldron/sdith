commons:
  - name: sdith_common_base
    folder_name: .
    sources: >- #aes128_ctrle_special_ref.c is excluded and liboqs AES is used instead
      integration/liboqs/fips202_glue.h
      integration/liboqs/fips202x4_glue.h
      integration/liboqs/aes_glue.h
      integration/liboqs/sdith_namespace.h
      lib/aes/aes128_ctrle.h
      lib/aes/aes128_ctrle_special_ref.c
      lib/aes/rijndael256.c
      lib/aes/rijndael256.h
      lib/aes/rijndael256_ctrle.h
      lib/aes/rijndael256_ctrle_special_ref.c
      src/commons.c
      src/commons.h
      src/ct_utils.c
      src/gf128.c
      src/gf192.c
      src/gf256.c
      src/ggm.c
      src/ggm.h
      src/matrix_transpose_f2.c
      src/matrix_vector_products_f2.c
      src/piop_circuit.c
      src/rsd.c
      src/sdith_algebra.h
      src/sdith_arithmetic.h
      src/sdith_ct_utils.h
      src/sdith_piop_circuits.h
      src/sdith_prng.c
      src/sdith_prng.h
      src/sdith_prng_private.h
      src/sdith_rsd.h
      src/sdith_signature.c
      src/sdith_signature.h
      src/sdith_signature_parameters.c
      src/sdith_vole_to_piop.h
      src/vole_expansion.c
      src/vole_generation.h
      src/vole_parameters.c
      src/vole_parameters.h
      src/vole_private.h
      src/vole_to_piop.c
    include_only: true
  - name: sdith_common_ref
    folder_name: .
    include_only: false
    common_dep: sdith_common_base
    compile_opts: >-
      -DSDITH3_FOR_LIBOQS
      -DNDEBUG
      -DONLY_REF_IMPLEMENTATION
      -DAPPLY_NAMESPACE=oqs_sig_private_sdith_ref_
  - name: sdith_common_avx2
    folder_name: .
    sources: >- # aes128_ctrle_special_avx2.c is intentionally included and isn't shimmed, since it offers improvements over liboqs AES
      lib/aes/rijndael256_avx.c
      lib/aes/rijndael256_avx.h
      lib/aes/aes128_ctrle_special_avx2.c
      lib/aes/rijndael256_ctrle_special_avx2.c
      src/ct_utils_avx2.c
      src/gf128_avx2.c
      src/gf192_avx2.c
      src/gf256_avx2.c
      src/matrix_vector_products_f2_avx2.c
      src/sdith_prng_avx2.c
      src/vole_parameters_avx2.c
    include_only: false
    common_dep: sdith_common_base
    compile_opts: >-
      -DSDITH3_FOR_LIBOQS
      -DNDEBUG
      -DAPPLY_NAMESPACE=oqs_sig_private_sdith_avx2_
    supported_platforms:
      - architecture: x86_64
        operating_systems:
          # - Darwin # TODO: needs small upstream build patches for support. As of writing, all x86 SDitH builds assume x86_LINUX. Darwin is missing a glibc header file for `__always_inline`
          - Linux
        required_flags:
          - avx2
          - avx
          - aes
          - pclmulqdq
  - name: sdith_common_api
    folder_name: .
    sources: integration/liboqs/api.c integration/liboqs/api.h integration/liboqs/check_params.h
    include_only: true
